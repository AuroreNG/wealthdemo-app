<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Bright airy light" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfefe"/>
      <stop offset=".38" stop-color="#f1f8f5"/>
      <stop offset=".72" stop-color="#e4efea"/>
      <stop offset="1" stop-color="#d7e7e0"/>
    </linearGradient>
    <linearGradient id="aray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aglass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".78"/>
      <stop offset=".5" stop-color="#eaf4ef" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="aedge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#1e9370" stop-opacity=".22"/>
    </linearGradient>
    <radialGradient id="ajade" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#1e9370" stop-opacity=".16"/>
      <stop offset="1" stop-color="#1e9370" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="adepth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe2da" stop-opacity="0"/>
      <stop offset="1" stop-color="#a9c8bc" stop-opacity=".7"/>
    </linearGradient>
    <filter id="asoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
    <filter id="ablur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#abg)"/>

  <g filter="url(#asoft)">
    <ellipse cx="1280" cy="880" rx="420" ry="300" fill="url(#ajade)"/>
    <ellipse cx="260" cy="120" rx="420" ry="280" fill="#ffffff" fill-opacity=".9"/>
  </g>

  <!-- light streaks -->
  <g opacity=".85">
    <polygon points="0,0 520,0 120,1000 -220,1000" fill="url(#aray)"/>
    <polygon points="700,0 980,0 520,1000 300,1000" fill="url(#aray)" opacity=".55"/>
    <polygon points="1180,0 1420,0 1080,1000 880,1000" fill="url(#aray)" opacity=".4"/>
  </g>

  <!-- distant skyline, softly out of focus -->
  <g filter="url(#ablur)" fill="#c9d8d1" fill-opacity=".55">
    <rect x="1020" y="560" width="54" height="300"/>
    <rect x="1090" y="620" width="38" height="240"/>
    <rect x="1150" y="530" width="62" height="330"/>
    <rect x="1230" y="600" width="40" height="260"/>
    <rect x="1290" y="560" width="56" height="300"/>
    <rect x="1370" y="620" width="38" height="240"/>
    <rect x="1430" y="580" width="58" height="280"/>
  </g>

  <!-- floating glass panels -->
  <g>
    <rect x="1120" y="140" width="330" height="700" rx="26" fill="url(#aglass)" stroke="#ffffff" stroke-opacity=".9" stroke-width="1.5"/>
    <rect x="1120" y="140" width="330" height="700" rx="26" fill="none" stroke="url(#aedge)" stroke-width="1.5"/>
    <rect x="1330" y="300" width="240" height="520" rx="22" fill="#ffffff" fill-opacity=".38" stroke="#ffffff" stroke-opacity=".8"/>
  </g>

  <!-- polished surface -->
  <path d="M980 860 h620 v140 h-620 z" fill="#ffffff" fill-opacity=".55"/>
  <path d="M980 860 h620" stroke="#ffffff" stroke-opacity=".9" stroke-width="2"/>
  <ellipse cx="1470" cy="905" rx="52" ry="14" fill="#dfe9e4" fill-opacity=".5"/>
  <circle cx="1470" cy="866" r="34" fill="#ffffff" fill-opacity=".8"/>
  <circle cx="1458" cy="855" r="11" fill="#ffffff"/>

  <!-- foliage hint -->
  <g fill="#7fae96" fill-opacity=".28">
    <ellipse cx="1560" cy="470" rx="70" ry="26" transform="rotate(-28 1560 470)"/>
    <ellipse cx="1520" cy="540" rx="58" ry="22" transform="rotate(-12 1520 540)"/>
    <ellipse cx="1575" cy="600" rx="62" ry="24" transform="rotate(-38 1575 600)"/>
  </g>

  <!-- cool depth so glass has something to sit on -->
  <rect y="620" width="1600" height="380" fill="url(#adepth)"/>
</svg>
